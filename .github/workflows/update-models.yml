name: Update model catalog

# Keeps lib/providers/catalog-data.js in step with what providers actually
# serve. Opens a PR — never pushes to master — so every model change is
# reviewed before shipping.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch current model lists
        id: update
        run: |
          node scripts/update-catalog.mjs | tee catalog-report.txt
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          cat catalog-report.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          rm catalog-report.txt

      - name: Verify the new catalog still passes
        run: |
          npm run lint
          npm test

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-model-catalog
          delete-branch: true
          title: "chore: update model catalog"
          commit-message: "chore: update model catalog from models.dev"
          body: |
            Automatic weekly update of the built-in model lists
            (`lib/providers/catalog-data.js`), generated by
            `scripts/update-catalog.mjs` from [models.dev](https://models.dev).

            The generator only **adds** models — nothing is removed
            automatically, since providers keep serving models long after they
            stop promoting them. Known-retired IDs are never re-added.

            ```
            ${{ steps.update.outputs.report }}
            ```

            Before merging, sanity-check that new entries look like real chat
            models for that provider. Anything wrong here is recoverable: users
            can always type a model ID by hand, and the live model refresh
            fetches the provider's real list.
          labels: dependencies
